name: QuickEats static page syntax check

on:
  push:
    branches:
      - quickeats-analytics-refunds
  pull_request:
    branches:
      - main

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Show checked revision
        run: git rev-parse HEAD
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.js index.html analytics.html
