name: QuickEats Vendor Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "quick-eats-vendor-pro-nov-2-2026-12-00-02-am.zip"
      - ".github/workflows/vendor-android-build.yml"

permissions:
  contents: read

jobs:
  build-vendor-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out vendor repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract and inspect Android project
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="quick-eats-vendor-pro-nov-2-2026-12-00-02-am.zip"
          test -f "$ARCHIVE"
          mkdir -p android-project
          unzip -q "$ARCHIVE" -d android-project
          echo "Archive contents (first 250 entries):"
          find android-project -maxdepth 6 -type f | sort | head -250
          SETTINGS="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in the uploaded ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$PROPERTIES" ]; then
            echo "::error::Gradle wrapper properties are missing; cannot determine the project's Gradle version safely."
            exit 1
          fi
          DISTRIBUTION_URL="$(sed -n 's/^distributionUrl=//p' "$PROPERTIES" | tr -d '\r')"
          GRADLE_VERSION="$(printf '%s' "$DISTRIBUTION_URL" | sed -E 's#.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-(bin|all)\.zip.*#\1#')"
          if ! printf '%s' "$GRADLE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Could not parse Gradle version from wrapper properties."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"
          echo "Project Gradle version: $GRADLE_VERSION"

      - name: Fix QuickEats vendor backend schema mapping
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/data/SupabaseApiClient.kt")
          s = p.read_text()
          replacements = [
              ('/rest/v1/restaurants?owner_id=eq.', '/rest/v1/vendors?owner_id=eq.'),
              ('/rest/v1/vendors?auth_user_id=eq.', '/rest/v1/vendors?owner_id=eq.'),
              ('/rest/v1/orders?restaurant_id=eq.', '/rest/v1/orders?vendor_id=eq.'),
              ('/rest/v1/menu_categories?restaurant_id=eq.', '/rest/v1/menu_categories?vendor_id=eq.'),
              ('/rest/v1/menu_items?restaurant_id=eq.', '/rest/v1/menu_items?vendor_id=eq.'),
              ('put("restaurant_id", item.vendorId)', 'put("vendor_id", item.vendorId)'),
              ('name = obj.optString("name", "Quick Eats Restaurant")', 'name = obj.optString("store_name", obj.optString("name", "Quick Eats Restaurant"))'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"Expected source text not found: {old}")
              s = s.replace(old, new)
          s = s.replace(
              'val items = itemsMap[id] ?: emptyList()',
              'val items = parseEmbeddedOrderItems(obj).ifEmpty { itemsMap[id] ?: emptyList() }'
          )
          anchor = '    private fun fetchOrderItemsBatch(\n'
          helper = '''
            private fun parseEmbeddedOrderItems(order: JSONObject): List<OrderItem> {
                val array = order.optJSONArray("items") ?: order.optJSONArray("cart_items") ?: return emptyList()
                val parsed = mutableListOf<OrderItem>()
                for (i in 0 until array.length()) {
                    val item = array.optJSONObject(i) ?: continue
                    parsed.add(
                        OrderItem(
                            id = item.optString("id", UUID.randomUUID().toString()),
                            menuItemId = item.optString("menu_item_id", item.optString("product_id", "")),
                            name = item.optString("item_name", item.optString("name", item.optString("title", "Food Item"))),
                            quantity = item.optInt("quantity", item.optInt("qty", 1)).coerceAtLeast(1),
                            unitPrice = item.optDouble("unit_price", item.optDouble("price", 0.0)),
                            options = item.optString("options_note", item.optString("options", "")),
                            imageUrl = item.optString("image_url", "")
                        )
                    )
                }
                return parsed
            }
          '''
          if anchor not in s:
              raise SystemExit("Could not find order item helper insertion point")
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          model = Path("app/src/main/java/com/example/model/Models.kt")
          m = model.read_text()
          m = m.replace('"pending" -> PENDING', '"pending", "new", "awaiting_payment" -> PENDING')
          model.write_text(m)
          print("Patched vendor lookup, order/menu vendor_id filters, embedded WhatsApp order items and new-order status mapping.")
          PY

      - name: Set up project Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.inspect.outputs.gradle_version }}

      - name: Inspect Android signing configuration
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          echo "Signing config references:"
          grep -n -A 18 -B 4 -E "signingConfigs|debugConfig|storeFile|keyAlias|storePassword|keyPassword" app/build.gradle.kts || true

      - name: Create Android debug keystore
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -s debug.keystore

      - name: Build debug APK
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Vendor APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickeats-vendor-debug-apk
          path: |
            ${{ steps.inspect.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package Android source for order-flow inspection
        if: success()
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "$GITHUB_WORKSPACE/vendor-android-source-inspection.zip" . -x '**/build/**' '**/.gradle/**'

      - name: Upload Android source inspection archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickeats-vendor-source-inspection
          path: vendor-android-source-inspection.zip
          if-no-files-found: error
          retention-days: 3
