name: QuickEats Vendor Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "quick-eats-vendor-pro-nov-2-2026-12-00-02-am.zip"
      - ".github/workflows/vendor-android-build.yml"

permissions:
  contents: read

jobs:
  build-vendor-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out vendor repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract and inspect Android project
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="quick-eats-vendor-pro-nov-2-2026-12-00-02-am.zip"
          test -f "$ARCHIVE"
          mkdir -p android-project
          unzip -q "$ARCHIVE" -d android-project
          echo "Archive contents (first 250 entries):"
          find android-project -maxdepth 6 -type f | sort | head -250
          WRAPPER="$(find android-project -type f -name gradlew -print -quit)"
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            SETTINGS="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::No Gradle wrapper or settings.gradle file found in the uploaded ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            echo "::error::The Android project has no Gradle wrapper. Add the Gradle wrapper files before building."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Vendor APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickeats-vendor-debug-apk
          path: |
            ${{ steps.inspect.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
