name: QuickEats Vendor Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "quick-eats-vendor-pro-nov-2-2026-12-00-02-am.zip"
      - ".github/workflows/vendor-android-build.yml"

permissions:
  contents: read

jobs:
  build-vendor-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out vendor repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract and inspect Android project
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="quick-eats-vendor-pro-nov-2-2026-12-00-02-am.zip"
          test -f "$ARCHIVE"
          mkdir -p android-project
          unzip -q "$ARCHIVE" -d android-project
          echo "Archive contents (first 250 entries):"
          find android-project -maxdepth 6 -type f | sort | head -250
          SETTINGS="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in the uploaded ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$PROPERTIES" ]; then
            echo "::error::Gradle wrapper properties are missing; cannot determine the project's Gradle version safely."
            exit 1
          fi
          DISTRIBUTION_URL="$(sed -n 's/^distributionUrl=//p' "$PROPERTIES" | tr -d '\r')"
          GRADLE_VERSION="$(printf '%s' "$DISTRIBUTION_URL" | sed -E 's#.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-(bin|all)\.zip.*#\1#')"
          if ! printf '%s' "$GRADLE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Could not parse Gradle version from wrapper properties."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_DIR"
          echo "Project Gradle version: $GRADLE_VERSION"

      - name: Set up project Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.inspect.outputs.gradle_version }}

      - name: Build debug APK
        working-directory: ${{ steps.inspect.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Vendor APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickeats-vendor-debug-apk
          path: |
            ${{ steps.inspect.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
