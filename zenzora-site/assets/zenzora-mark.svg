 <textPath href="#topArc" startOffset="50%" text-anchor="middle">ZENZ</textPath>
</text>
<text x="355" y="104" fill="#00BFA5" font-family="Montserrat,Inter,Arial,sans-serif" font-size="31" font-weight="500" letter-spacing="5">RA</text>
