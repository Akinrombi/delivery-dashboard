<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor Partner Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #00A859; --bg: #0F172A; --card-bg: #1E293B; --text: #F8FAFC; --text-muted: #94A3B8; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding-bottom: 80px; }
    .app-container { width: 100%; max-width: 480px; min-height: 100vh; position: relative; }
    .top-bar { background: var(--card-bg); padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .main-content { padding: 16px; }
    .section-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; background: #0F172A; border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; padding: 12px 0; z-index: 9999; }
    .nav-item { flex: 1; text-align: center; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div style="font-weight:700;">🏪 Ikorodu Kitchen</div>
    <span style="color:var(--primary); font-size:12px; font-weight:bold;">ONLINE</span>
  </div>

  <div class="main-content">
    <!-- Orders Tab -->
    <div id="tab-orders" class="tab-section active">
      <div class="section-title">Live Orders</div>
      <button class="btn btn-primary" onclick="createTestOrder()" style="margin-bottom:12px;">+ DISPATCH NEW TEST ORDER TO RIDER APP</button>
      <div id="vendor-orders-list">Loading orders...</div>
    </div>

    <!-- Menu Tab -->
    <div id="tab-menu" class="tab-section">
      <div class="section-title">Menu Management</div>
      <button class="btn btn-outline" onclick="openMenuModal()" style="margin-bottom:12px;">+ ADD NEW MENU ITEM</button>
      <div id="vendor-menu-list">Loading menu...</div>
    </div>
  </div>

  <!-- Add Menu Modal -->
  <div id="menu-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">Add Menu Item</h3>
      <div class="input-group">
        <label>Item Name</label>
        <input type="text" id="menu-name-input" placeholder="e.g. Jollof Rice & Chicken">
      </div>
      <div class="input-group">
        <label>Price (₦)</label>
        <input type="number" id="menu-price-input" placeholder="e.g. 2500">
      </div>
      <button class="btn btn-primary" onclick="saveMenuItem()" style="margin-bottom:8px;">SAVE ITEM</button>
      <button class="btn btn-outline" onclick="closeMenuModal()">CANCEL</button>
    </div>
  </div>

  <!-- Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('orders', this)">📦 Orders</div>
    <div class="nav-item" onclick="switchTab('menu', this)">🍲 Menu</div>
  </div>
</div>

<script>
  // ⚠️ REPLACE WITH YOUR ACTUAL SUPABASE URL AND ANON KEY
  const SUPABASE_URL = "https://YOUR_SUPABASE_URL.supabase.co";
  const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  window.switchTab = function(tabName, el) {
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    el.classList.add('active');
  };

  function openMenuModal() { document.getElementById('menu-modal').style.display = 'flex'; }
  function closeMenuModal() { document.getElementById('menu-modal').style.display = 'none'; }

  // Save new item to Supabase
  async function saveMenuItem() {
    const name = document.getElementById('menu-name-input').value;
    const price = document.getElementById('menu-price-input').value;
    if (!name || !price) return alert("Please fill in both fields");

    const { error } = await supabase.from('menu_items').insert([
      { vendor_name: 'Ikorodu Kitchen', item_name: name, price: parseFloat(price) }
    ]);

    if (error) {
      alert("Error adding item: " + error.message);
    } else {
      alert("Menu item added successfully!");
      closeMenuModal();
      fetchMenuItems();
    }
  }

  // Load menu items from Supabase
  async function fetchMenuItems() {
    const container = document.getElementById('vendor-menu-list');
    const { data, error } = await supabase.from('menu_items').select('*').order('created_at', { ascending: false });
    if (error || !data.length) {
      container.innerHTML = "<p style='color:var(--text-muted);'>No items in menu yet.</p>";
      return;
    }
    container.innerHTML = data.map(item => `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong>${item.item_name}</strong>
          <div style="color:var(--primary); font-weight:bold;">₦${item.price}</div>
        </div>
      </div>
    `).join('');
  }

  // Dispatch live order to database so rider app picks it up
  async function createTestOrder() {
    const { error } = await supabase.from('orders').insert([
      {
        vendor_name: 'Ikorodu Kitchen (Sabo)',
        customer_name: 'Hawa B.',
        delivery_address: 'Agric Bus Stop',
        items: [{ name: 'Jollof Rice', qty: 2 }],
        total_amount: 3500,
        status: 'pending'
      }
    ]);

    if (error) alert("Order dispatch failed: " + error.message);
    else alert("Order created! Check the Rider App now.");
  }

  fetchMenuItems();
</script>
</body>
</html>
