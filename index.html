<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Control Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#00A859;--bg:#0F172A;--card:#1E293B;--white:#F8FAFC;--gray:#94A3B8;--border:#334155;--red:#EF4444;--orange:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--white);padding:12px;display:flex;justify-content:center;min-height:100vh;padding-bottom:40px}
.app{width:100%;max-width:480px}
.banner{display:none;background:var(--red);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:700;border-radius:8px;margin-bottom:12px}
.header{background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.title{font-size:16px;font-weight:700}.sub{font-size:12px;color:var(--gray)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1;min-width:78px;min-height:48px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--gray);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tab.active{border-color:var(--green);color:var(--green);background:rgba(0,168,89,.1)}
.badge{background:var(--bg);padding:2px 6px;border-radius:10px;font-size:10px;color:var(--white)}
.box{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:12px}
.box-title{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.order{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:8px}
.btn{width:100%;min-height:48px;border-radius:8px;border:none;font-weight:700;font-size:14px;cursor:pointer}
.btn-green{background:var(--green);color:#fff}.btn-orange{background:var(--orange);color:#000}
.btn-red{background:transparent;border:1px solid var(--red);color:var(--red);margin-top:8px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px}
.field input{width:100%;min-height:48px;padding:10px;background:var(--bg);border:1px solid var(--border);color:var(--white);border-radius:8px;font-size:14px}
.note{font-size:11px;margin:6px 0}
</style>
</head>
<body>
<div class="app">

<div id="authScreen" class="box">
  <div class="box-title" style="margin-bottom:12px">Vendor Login</div>
  <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="vendor@test.com"></div>
  <div class="field"><label>Password</label><input type="password" id="authPass"></div>
  <button class="btn btn-green" onclick="handleAuth()">SIGN IN</button>
</div>

<div id="main" style="display:none">
  <div id="banner" class="banner">⚠️ Connection lost. Reconnecting...</div>
  <div class="header">
    <div><div class="title" id="storeTitle">Vendor Kitchen</div><div class="sub">Vendor Control Dashboard</div></div>
    <button class="btn btn-green" style="width:auto;min-height:40px;padding:0 14px;font-size:11px" onclick="handleSignOut()">SIGN OUT</button>
  </div>

  <div class="box" style="display:flex;gap:10px">
    <div style="flex:1"><div class="sub">TODAY'S SALES</div><div style="font-size:20px;font-weight:800" id="sales">₦0</div></div>
    <div style="flex:1"><div class="sub">COMPLETED</div><div style="font-size:20px;font-weight:800" id="completed">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-new" onclick="setFilter('new')">NEW<span class="badge" id="b-new">0</span></button>
    <button class="tab" id="tab-preparing" onclick="setFilter('preparing')">PREPARING<span class="badge" id="b-preparing">0</span></button>
    <button class="tab" id="tab-ready_for_rider" onclick="setFilter('ready_for_rider')">READY<span class="badge" id="b-ready_for_rider">0</span></button>
    <button class="tab" id="tab-ontheway" onclick="setFilter('ontheway')">ON THE WAY<span class="badge" id="b-ontheway">0</span></button>
    <button class="tab" id="tab-delivered" onclick="setFilter('delivered')">DONE<span class="badge" id="b-delivered">0</span></button>
  </div>

  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="box-title">Live Orders</div>
      <button onclick="createTestOrder()" style="background:transparent;color:var(--green);border:none;font-weight:bold;cursor:pointer;min-height:40px">+ Test Order</button>
    </div>
    <div id="orders"></div>
  </div>
</div>
</div>

<script>
// PASTE YOUR REAL VALUES HERE (Supabase > Settings > API). Use the anon key ONLY.
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ON_THE_WAY = ['accepted','arrived_at_vendor','picked_up','arrived_at_customer'];
const LABELS = {accepted:'Rider accepted',arrived_at_vendor:'Rider at your store',picked_up:'Picked up',arrived_at_customer:'Arrived at customer'};
let vendor = null, filter = 'new', allOrders = [], started = false;

window.onload = async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) initDashboard(session.user);
};

async function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) alert(error.message); else initDashboard(data.user);
}
async function handleSignOut() { await sb.auth.signOut(); location.reload(); }

async function initDashboard(user) {
  const { data, error } = await sb.from('vendors').select('*').eq('owner_id', user.id).maybeSingle();
  if (error || !data) { alert('No vendor account found for this login. Check the role setup.'); await sb.auth.signOut(); return; }
  vendor = data;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('storeTitle').innerText = vendor.store_name;
  fetchOrders();
  if (!started) { started = true; subscribe(); setInterval(fetchOrders, 10000); }
}

function subscribe() {
  sb.channel('vendor-orders')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, fetchOrders)
    .subscribe(s => {
      document.getElementById('banner').style.display = (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') ? 'block' : 'none';
    });
}

async function fetchOrders() {
  if (!vendor) return;
  const { data, error } = await sb.from('orders')
    .select('*, riders(id, rating, profiles(name, phone))')
    .eq('vendor_id', vendor.id)
    .order('created_at', { ascending: false });
  if (error) { console.error(error); document.getElementById('banner').style.display = 'block'; return; }
  document.getElementById('banner').style.display = 'none';
  allOrders = data || [];
  render();
}

function groupOf(o) { return ON_THE_WAY.includes(o.status) ? 'ontheway' : o.status; }

function render() {
  ['new','preparing','ready_for_rider','ontheway','delivered'].forEach(g => {
    document.getElementById('b-' + g).innerText = allOrders.filter(o => groupOf(o) === g).length;
  });
  const today = new Date().toDateString();
  const done = allOrders.filter(o => o.status === 'delivered' && new Date(o.delivered_at).toDateString() === today);
  document.getElementById('completed').innerText = done.length;
  document.getElementById('sales').innerText = '₦' + done.reduce((s, o) => s + Number(o.total), 0).toLocaleString();

  const list = allOrders.filter(o => groupOf(o) === filter);
  const box = document.getElementById('orders');
  if (!list.length) { box.innerHTML = '<p style="color:var(--gray);font-size:12px;text-align:center">No orders here yet.</p>'; return; }

  box.innerHTML = list.map(o => {
    let btn = '';
    if (o.status === 'new') btn = `<button class="btn btn-green" onclick="changeStatus('${o.id}','preparing')">ACCEPT & PREPARE</button>`;
    if (o.status === 'preparing') btn = `<button class="btn btn-orange" onclick="changeStatus('${o.id}','ready_for_rider')">READY FOR RIDER</button>`;
    if (['new','preparing','ready_for_rider','accepted','arrived_at_vendor'].includes(o.status))
      btn += `<button class="btn btn-red" onclick="cancelOrder('${o.id}')">CANCEL ORDER</button>`;
    const p = o.riders && o.riders.profiles;
    const rider = p ? `<div class="note" style="color:var(--green)">🛵 ${esc(p.name)} · <a style="color:var(--green)" href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div>` : '';
    const st = LABELS[o.status] ? `<div class="note" style="color:var(--orange)">${LABELS[o.status]}</div>` : '';
    const code = (o.pickup_code && o.status !== 'delivered') ? `<div class="note" style="color:var(--orange)">Pickup code (give to rider): <strong style="font-size:16px">${o.pickup_code}</strong></div>` : '';
    const items = (o.items || []).map(i => `${esc(String(i.qty))}x ${esc(i.name)}`).join(', ');
    return `<div class="order">
      <div class="order-head"><span style="font-weight:800">${esc(o.order_number)}</span><span style="color:var(--green);font-weight:800">₦${Number(o.total).toLocaleString()}</span></div>
      <div class="note" style="color:var(--gray)">${items}</div>
      <div class="note" style="color:var(--gray)">📍 ${esc(o.customer_name)} (${esc(o.delivery_address)})</div>
      ${st}${rider}${code}
      <div style="margin-top:10px">${btn}</div></div>`;
  }).join('');
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function changeStatus(id, status) {
  const { data, error } = await sb.rpc('update_order_status', { p_order_id: id, p_new_status: status });
  if (error) alert(error.message); else if (!data.success) alert(data.message);
  fetchOrders();
}
function cancelOrder(id) { if (confirm('Cancel this order?')) changeStatus(id, 'cancelled'); }

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + f).classList.add('active');
  render();
}

async function createTestOrder() {
  const num = '#' + Math.floor(1000 + Math.random() * 9000);
  const { error } = await sb.from('orders').insert({
    order_number: num, vendor_id: vendor.id, customer_name: 'Hawa B.', customer_phone: '08011112222',
    delivery_address: 'Agric Bus Stop, Ikorodu', items: [{ name: 'Jollof Rice & Fried Chicken', qty: 1, price: 3500 }],
    total: 3500, delivery_fee: 1000, status: 'new'
  });
  if (error) alert(error.message);
  fetchOrders();
}
</script>
</body>
</html>
