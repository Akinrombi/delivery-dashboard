<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor Control Dashboard</title>

  <style>
    :root {
      --primary-color: #00A859;
      --bg-dark: #0F172A;
      --card-bg-dark: #1E293B;
      --text-white: #F8FAFC;
      --text-gray: #94A3B8;
      --border-dark: #334155;
      --danger-red: #EF4444;
      --warning-orange: #F59E0B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding: 16px; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 40px; }
    .app-wrapper { width: 100%; max-width: 480px; }

    /* Header */
    .top-header { background: var(--card-bg-dark); padding: 16px; border-radius: 12px; border: 1px solid var(--border-dark); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-subtitle { font-size: 12px; color: var(--text-gray); }
    .badge-status { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; }
    .open-state { background: rgba(0, 168, 89, 0.2); color: var(--primary-color); border: 1px solid var(--primary-color); }
    .closed-state { background: rgba(239, 68, 68, 0.2); color: var(--danger-red); border: 1px solid var(--danger-red); }

    /* Navigation Bar */
    .tab-navigation { display: flex; background: var(--card-bg-dark); padding: 4px; border-radius: 10px; border: 1px solid var(--border-dark); margin-bottom: 16px; gap: 4px; }
    .tab-button { flex: 1; padding: 12px 0; background: transparent; border: none; color: var(--text-gray); font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 8px; text-align: center; }
    .tab-button.is-selected { background: var(--primary-color); color: #ffffff; font-weight: 700; }

    /* Cards & Form Layouts */
    .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat-box { background: var(--card-bg-dark); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-dark); }
    .stat-number { font-size: 18px; font-weight: 800; color: var(--text-white); margin-top: 4px; }

    .content-box { background: var(--card-bg-dark); border-radius: 12px; padding: 16px; border: 1px solid var(--border-dark); margin-bottom: 16px; }
    .box-title { font-size: 13px; font-weight: 700; color: var(--text-gray); text-transform: uppercase; margin-bottom: 14px; letter-spacing: 0.5px; }

    /* Form Inputs */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-gray); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: #0F172A; border: 1px solid var(--border-dark); color: var(--text-white); border-radius: 8px; font-size: 14px; outline: none; }

    /* Action Buttons */
    .action-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn-green { background-color: var(--primary-color); color: white; }
    .btn-yellow { background-color: var(--warning-orange); color: #000; padding: 8px 12px; font-size: 12px; border-radius: 6px; border:none; font-weight:700; cursor:pointer;}
    .btn-red { background-color: transparent; color: var(--danger-red); border: 1px solid var(--danger-red); padding: 4px 8px; font-size: 11px; border-radius: 6px; cursor:pointer; }

    /* Custom Item Row */
    .row-item { padding: 12px 0; border-bottom: 1px solid var(--border-dark); }
    .row-item:last-child { border-bottom: none; }
    .item-title-text { font-weight: 600; font-size: 15px; display: block; }
    .item-price-text { color: var(--primary-color); font-weight: 700; font-size: 14px; margin-top: 2px; }
    .item-tag { font-size: 11px; color: var(--text-gray); background: #0F172A; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }

    /* Stock Switch */
    .switch-toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch-toggle input { opacity: 0; width: 0; height: 0; }
    .slider-track { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 20px; }
    .slider-track:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider-track { background-color: var(--primary-color); }
    input:checked + .slider-track:before { transform: translateX(16px); }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- Main Header -->
  <div class="top-header">
    <div>
      <div class="header-title" id="vendorStoreTitle">My Vendor Store</div>
      <div class="header-subtitle">Vendor Control Dashboard</div>
    </div>
    <button id="storeStatusBtn" class="badge-status open-state" onclick="toggleStoreStatus()">STORE OPEN</button>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="tab-navigation">
    <button id="btn-tab-orders" class="tab-button is-selected" onclick="showSection('view-orders', 'btn-tab-orders')">Orders</button>
    <button id="btn-tab-menu" class="tab-button" onclick="showSection('view-menu', 'btn-tab-menu')">Menu Manager</button>
    <button id="btn-tab-settings" class="tab-button" onclick="showSection('view-settings', 'btn-tab-settings')">Settings</button>
  </div>

  <!-- SECTION 1: ORDERS & SALES -->
  <div id="view-orders" style="display: block;">
    <div class="stats-container">
      <div class="stat-box">
        <div style="font-size:11px; color:var(--text-gray); font-weight:600;">TODAY'S SALES</div>
        <div class="stat-number" id="totalEarnings">₦0</div>
      </div>
      <div class="stat-box">
        <div style="font-size:11px; color:var(--text-gray); font-weight:600;">COMPLETED ORDERS</div>
        <div class="stat-number" id="totalOrdersCount">0</div>
      </div>
    </div>

    <div class="content-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div class="box-title" style="margin:0;">Incoming Customer Orders</div>
        <button onclick="addDemoOrder()" style="background:transparent; color:var(--primary-color); border:none; font-size:12px; font-weight:bold; cursor:pointer;">+ Test Order</button>
      </div>
      <div id="ordersContainer">
        <p style="color: var(--text-gray); font-size: 13px; text-align: center; padding: 10px 0;">No active incoming orders.</p>
      </div>
    </div>
  </div>

  <!-- SECTION 2: MENU MANAGER -->
  <div id="view-menu" style="display: none;">
    <div class="content-box">
      <div class="box-title">Add New Dish / Food Item</div>

      <div class="form-group">
        <label for="itemCategory">Category</label>
        <select id="itemCategory">
          <option value="Main Dishes">Main Dishes (Rice, Swallows)</option>
          <option value="Proteins">Proteins (Chicken, Meat, Fish)</option>
          <option value="Sides & Extras">Sides & Extras (Plantain, Chips)</option>
          <option value="Drinks & Beverages">Drinks & Beverages</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="itemName">Food / Dish Name</label>
        <input type="text" id="itemName" placeholder="e.g. Jollof Rice & Fried Chicken">
      </div>

      <div class="form-group">
        <label for="itemPrice">Price in Naira (₦)</label>
        <input type="number" id="itemPrice" placeholder="e.g. 2500">
      </div>

      <button class="action-btn btn-green" onclick="addMenuItem()">+ ADD TO MENU</button>
    </div>

    <div class="content-box">
      <div class="box-title">Current Store Menu</div>
      <div id="menuContainer">
        <p style="color: var(--text-gray); font-size: 13px; text-align: center; padding: 10px 0;">No food items added yet.</p>
      </div>
    </div>
  </div>

  <!-- SECTION 3: STORE SETTINGS -->
  <div id="view-settings" style="display: none;">
    <div class="content-box">
      <div class="box-title">Store Profile & Details</div>
      
      <div class="form-group">
        <label for="storeNameInput">Store Name</label>
        <input type="text" id="storeNameInput" value="My Vendor Store">
      </div>

      <div class="form-group">
        <label for="storePhoneInput">Store Contact Phone</label>
        <input type="tel" id="storePhoneInput" placeholder="08012345678">
      </div>

      <div class="form-group">
        <label for="prepTimeInput">Average Preparation Time</label>
        <select id="prepTimeInput">
          <option value="15">15 - 20 Minutes</option>
          <option value="30" selected>25 - 30 Minutes</option>
          <option value="45">40 - 45 Minutes</option>
        </select>
      </div>

      <button class="action-btn btn-green" onclick="saveSettings()">SAVE SETTINGS</button>
    </div>
  </div>

</div>

<script>
  let isStoreOpen = true;

  document.addEventListener('DOMContentLoaded', () => {
    loadMenu();
    loadOrders();
    loadSettings();
  });

  // Direct In-line Tab Switcher
  function showSection(sectionId, btnId) {
    // Hide all sections directly
    document.getElementById('view-orders').style.display = 'none';
    document.getElementById('view-menu').style.display = 'none';
    document.getElementById('view-settings').style.display = 'none';

    // Show selected section directly
    document.getElementById(sectionId).style.display = 'block';

    // Update active button state
    document.getElementById('btn-tab-orders').classList.remove('is-selected');
    document.getElementById('btn-tab-menu').classList.remove('is-selected');
    document.getElementById('btn-tab-settings').classList.remove('is-selected');

    document.getElementById(btnId).classList.add('is-selected');
  }

  // Toggle Open/Closed State
  function toggleStoreStatus() {
    isStoreOpen = !isStoreOpen;
    const btn = document.getElementById('storeStatusBtn');
    if (isStoreOpen) {
      btn.className = 'badge-status open-state';
      btn.innerText = 'STORE OPEN';
    } else {
      btn.className = 'badge-status closed-state';
      btn.innerText = 'STORE CLOSED';
    }
  }

  // Menu Handling
  function getMenu() {
    return JSON.parse(localStorage.getItem('vendor_store_menu') || '[]');
  }

  function addMenuItem() {
    const category = document.getElementById('itemCategory').value;
    const name = document.getElementById('itemName').value.trim();
    const price = document.getElementById('itemPrice').value.trim();

    if (!name || !price) {
      alert("Please enter both dish name and price.");
      return;
    }

    const currentMenu = getMenu();
    currentMenu.push({ id: Date.now(), category: category, name: name, price: price, inStock: true });
    localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));

    document.getElementById('itemName').value = '';
    document.getElementById('itemPrice').value = '';
    loadMenu();
  }

  function toggleStock(id) {
    const currentMenu = getMenu();
    const item = currentMenu.find(i => i.id === id);
    if (item) {
      item.inStock = !item.inStock;
      localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));
      loadMenu();
    }
  }

  function deleteItem(id) {
    let currentMenu = getMenu();
    currentMenu = currentMenu.filter(item => item.id !== id);
    localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));
    loadMenu();
  }

  function loadMenu() {
    const menu = getMenu();
    const container = document.getElementById('menuContainer');

    if (menu.length === 0) {
      container.innerHTML = `<p style="color: var(--text-gray); font-size: 13px; text-align: center; padding: 10px 0;">No food items added yet.</p>`;
      return;
    }

    container.innerHTML = menu.map(item => `
      <div class="row-item" style="display:flex; justify-content:space-between; align-items:center; opacity: ${item.inStock ? '1' : '0.5'};">
        <div>
          <span class="item-tag">${item.category || 'General'}</span>
          <span class="item-title-text">${item.name} ${!item.inStock ? '<small style="color:var(--danger-red);">(Sold Out)</small>' : ''}</span>
          <div class="item-price-text">₦${Number(item.price).toLocaleString()}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <label class="switch-toggle">
            <input type="checkbox" ${item.inStock ? 'checked' : ''} onchange="toggleStock(${item.id})">
            <span class="slider-track"></span>
          </label>
          <button class="btn-red" onclick="deleteItem(${item.id})" style="margin-left:10px;">Delete</button>
        </div>
      </div>
    `).join('');
  }

  // Orders Handling
  function getOrders() {
    return JSON.parse(localStorage.getItem('vendor_active_orders') || '[]');
  }

  function addDemoOrder() {
    const orders = getOrders();
    const demo = {
      id: Date.now(),
      customer: 'Hawa B.',
      address: 'Agric Bus Stop, Ikorodu',
      item: 'Jollof Rice & Fried Chicken',
      amount: 3500,
      status: 'Preparing'
    };
    orders.push(demo);
    localStorage.setItem('vendor_active_orders', JSON.stringify(orders));
    loadOrders();
  }

  function markReady(id) {
    let orders = getOrders();
    const order = orders.find(o => o.id === id);
    if (order) {
      let totalSales = parseFloat(localStorage.getItem('vendor_total_sales') || '0') + order.amount;
      let count = parseInt(localStorage.getItem('vendor_order_count') || '0') + 1;
      localStorage.setItem('vendor_total_sales', totalSales);
      localStorage.setItem('vendor_order_count', count);

      orders = orders.filter(o => o.id !== id);
      localStorage.setItem('vendor_active_orders', JSON.stringify(orders));
      loadOrders();
    }
  }

  function loadOrders() {
    const orders = getOrders();
    const container = document.getElementById('ordersContainer');
    
    document.getElementById('totalEarnings').innerText = '₦' + Number(localStorage.getItem('vendor_total_sales') || '0').toLocaleString();
    document.getElementById('totalOrdersCount').innerText = localStorage.getItem('vendor_order_count') || '0';

    if (orders.length === 0) {
      container.innerHTML = `<p style="color: var(--text-gray); font-size: 13px; text-align: center; padding: 10px 0;">No active incoming orders.</p>`;
      return;
    }

    container.innerHTML = orders.map(o => `
      <div class="row-item" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <span class="item-tag" style="color:var(--warning-orange); background:rgba(245,158,11,0.1);">${o.status}</span>
          <span class="item-title-text">${o.item}</span>
          <div style="font-size:12px; color:var(--text-gray); margin-top:2px;">📍 ${o.customer} (${o.address})</div>
          <div class="item-price-text" style="margin-top:2px;">₦${Number(o.amount).toLocaleString()}</div>
        </div>
        <button class="btn-yellow" onclick="markReady(${o.id})">READY FOR RIDER</button>
      </div>
    `).join('');
  }

  // Settings Handling
  function saveSettings() {
    const name = document.getElementById('storeNameInput').value;
    if (name) {
      localStorage.setItem('vendor_store_name', name);
      document.getElementById('vendorStoreTitle').innerText = name;
      alert("Store settings saved successfully!");
    }
  }

  function loadSettings() {
    const savedName = localStorage.getItem('vendor_store_name');
    if (savedName) {
      document.getElementById('vendorStoreTitle').innerText = savedName;
      document.getElementById('storeNameInput').value = savedName;
    }
  }
</script>

</body>
</html>
