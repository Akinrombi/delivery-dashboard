<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendor Partner App</title>

  <style>
    :root {
      --primary: #00A859;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: #334155;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; }

    /* Header */
    .store-header { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .store-title { font-size: 16px; font-weight: 700; }
    .store-subtitle { font-size: 12px; color: var(--text-muted); }
    .status-badge { background: rgba(0, 168, 89, 0.15); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }

    /* Cards */
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 14px; letter-spacing: 0.5px; }

    /* Form Fields */
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; padding: 12px; background: #0F172A; border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; outline: none; }
    .input-group input:focus, .input-group select:focus { border-color: var(--primary); }

    /* Buttons */
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 4px 8px; font-size: 11px; border-radius: 6px; }

    /* Menu Display List */
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .menu-item:last-child { border-bottom: none; }
    .item-name { font-weight: 600; font-size: 15px; display: block; }
    .item-price { color: var(--primary); font-weight: 700; font-size: 14px; margin-top: 2px; }
    .item-cat { font-size: 11px; color: var(--text-muted); background: #0F172A; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }

    /* Availability Toggle Switch */
    .toggle-wrap { display: flex; align-items: center; gap: 8px; margin-right: 8px; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Store Header -->
  <div class="store-header">
    <div>
      <div class="store-title">🏪 My Vendor Store</div>
      <div class="store-subtitle">Menu & Dish Management</div>
    </div>
    <span class="status-badge">STORE OPEN</span>
  </div>

  <!-- Form: Add Menu Item -->
  <div class="card">
    <div class="section-title">Add New Dish / Food Item</div>

    <div class="input-group">
      <label for="itemCategory">Category</label>
      <select id="itemCategory">
        <option value="Main Dishes">Main Dishes (Rice, Swallows)</option>
        <option value="Proteins">Proteins (Chicken, Meat, Fish)</option>
        <option value="Sides & Extra">Sides & Extras (Plantain, Chips)</option>
        <option value="Drinks & Beverages">Drinks & Beverages</option>
      </select>
    </div>
    
    <div class="input-group">
      <label for="itemName">Food / Dish Name</label>
      <input type="text" id="itemName" placeholder="e.g. Jollof Rice & Fried Chicken">
    </div>

    <div class="input-group">
      <label for="itemPrice">Price in Naira (₦)</label>
      <input type="number" id="itemPrice" placeholder="e.g. 2500">
    </div>

    <button class="btn btn-primary" onclick="addMenuItem()">+ ADD TO MENU</button>
  </div>

  <!-- Display: Current Store Menu -->
  <div class="card">
    <div class="section-title">Current Store Menu</div>
    <div id="menuContainer">
      <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">
        No food items added yet. Fill out the form above to list your first dish!
      </p>
    </div>
  </div>

</div>

<script>
  document.addEventListener('DOMContentLoaded', loadMenu);

  function getMenu() {
    return JSON.parse(localStorage.getItem('vendor_store_menu') || '[]');
  }

  function addMenuItem() {
    const categoryInput = document.getElementById('itemCategory');
    const nameInput = document.getElementById('itemName');
    const priceInput = document.getElementById('itemPrice');

    const category = categoryInput.value;
    const name = nameInput.value.trim();
    const price = priceInput.value.trim();

    if (!name || !price) {
      alert("Please type both the item name and price.");
      return;
    }

    const currentMenu = getMenu();
    currentMenu.push({
      id: Date.now(),
      category: category,
      name: name,
      price: price,
      inStock: true
    });

    localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));

    nameInput.value = '';
    priceInput.value = '';

    loadMenu();
  }

  function toggleStock(id) {
    const currentMenu = getMenu();
    const item = currentMenu.find(i => i.id === id);
    if (item) {
      item.inStock = !item.inStock;
      localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));
      loadMenu();
    }
  }

  function deleteItem(id) {
    let currentMenu = getMenu();
    currentMenu = currentMenu.filter(item => item.id !== id);
    localStorage.setItem('vendor_store_menu', JSON.stringify(currentMenu));
    loadMenu();
  }

  function loadMenu() {
    const menu = getMenu();
    const container = document.getElementById('menuContainer');

    if (menu.length === 0) {
      container.innerHTML = `
        <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">
          No food items added yet. Fill out the form above to list your first dish!
        </p>`;
      return;
    }

    container.innerHTML = menu.map(item => `
      <div class="menu-item" style="opacity: ${item.inStock ? '1' : '0.5'};">
        <div>
          <span class="item-cat">${item.category || 'General'}</span>
          <span class="item-name">${item.name} ${!item.inStock ? '<small style="color:var(--danger);">(Sold Out)</small>' : ''}</span>
          <div class="item-price">₦${Number(item.price).toLocaleString()}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <label class="switch" title="Toggle Stock Availability">
            <input type="checkbox" ${item.inStock ? 'checked' : ''} onchange="toggleStock(${item.id})">
            <span class="slider"></span>
          </label>
          <button class="btn btn-danger" onclick="deleteItem(${item.id})" style="margin-left:10px;">Delete</button>
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
