<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Partner Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <!-- TOP HEADER -->
  <div>
    <div class="flex items-center justify-between mb-4 bg-gray-900 p-4 rounded-2xl border border-gray-800">
      <div class="flex items-center gap-3">
        <div class="text-3xl">🍳</div>
        <div>
          <h1 id="store-name" class="text-lg font-bold text-emerald-400">Loading Store...</h1>
          <p id="store-email" class="text-xs text-gray-400">vendor@delivery.com</p>
        </div>
      </div>
      <button id="store-status-btn" onclick="toggleStoreStatus()" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2">
        <span id="status-text">Store Open</span> <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      </button>
    </div>

    <!-- WALLET & INSTANT CASHOUT BANNER -->
    <div class="bg-gradient-to-r from-emerald-900/40 to-gray-900 p-4 rounded-2xl border border-emerald-500/30 mb-6 flex justify-between items-center">
      <div>
        <p class="text-[10px] text-gray-400 uppercase tracking-wider font-bold">Today's Earnings</p>
        <h3 id="wallet-balance" class="text-2xl font-black text-emerald-400">₦0</h3>
      </div>
      <button onclick="requestInstantPayout()" class="bg-emerald-500 hover:bg-emerald-600 text-black text-xs font-extrabold px-3 py-2 rounded-xl shadow transition">
        ⚡ Instant Cashout
      </button>
    </div>

    <!-- METRICS CARDS -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-gray-900/80 p-4 rounded-2xl border border-gray-800">
        <p class="text-xs font-medium text-gray-400 mb-1">New Orders</p>
        <h2 id="metric-new" class="text-3xl font-extrabold text-amber-400">0</h2>
      </div>
      <div class="bg-gray-900/80 p-4 rounded-2xl border border-gray-800">
        <p class="text-xs font-medium text-gray-400 mb-1">Preparing</p>
        <h2 id="metric-preparing" class="text-3xl font-extrabold text-blue-400">0</h2>
      </div>
      <div class="bg-gray-900/80 p-4 rounded-2xl border border-gray-800">
        <p class="text-xs font-medium text-gray-400 mb-1">Ready for Rider</p>
        <h2 id="metric-ready" class="text-3xl font-extrabold text-emerald-400">0</h2>
      </div>
      <div class="bg-gray-900/80 p-4 rounded-2xl border border-gray-800">
        <p class="text-xs font-medium text-gray-400 mb-1">Est. Prep Time</p>
        <div class="flex items-baseline gap-1 mt-1">
          <span class="bg-gray-800 text-amber-300 px-2 py-0.5 rounded text-lg font-bold">20</span>
          <span class="text-xs text-gray-400">mins</span>
        </div>
      </div>
    </div>

    <!-- TAB SWITCHING -->
    <div class="flex bg-gray-900 p-1 rounded-xl border border-gray-800 mb-4">
      <button id="tab-btn-orders" onclick="switchTab('orders')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-black shadow transition">
        🔔 New Orders (<span id="badge-new">0</span>)
      </button>
      <button id="tab-btn-prep" onclick="switchTab('prep')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition">
        ⌛ Preparing / Pickup (<span id="badge-prep">0</span>)
      </button>
    </div>

    <!-- TAB 1: ORDERS CONTENT -->
    <div id="view-orders">
      <div id="orders-container" class="space-y-3">
        <div class="bg-gray-900/50 border border-gray-800/80 rounded-2xl p-8 text-center text-gray-500 text-sm">
          No orders in this tab
        </div>
      </div>
    </div>

    <!-- TAB 2: MENU CATALOG -->
    <div id="view-menu" class="hidden space-y-4">
      <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 space-y-3">
        <h3 class="text-sm font-bold text-gray-200">Add New Menu Item</h3>
        <input id="item-name" type="text" placeholder="Item Name (e.g. Jollof Rice)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
        <input id="item-price" type="number" placeholder="Price (₦)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
        <button onclick="addMenuItem()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-2.5 rounded-xl text-xs transition">
          + Save Food Item
        </button>
      </div>

      <div class="space-y-2">
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Current Menu Items</h3>
        <div id="menu-container" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur border-t border-gray-800 py-3 px-6 max-w-md mx-auto flex justify-around">
    <button onclick="switchNav('orders')" id="nav-orders" class="flex flex-col items-center gap-1 text-emerald-400">
      <span class="text-lg">🍴</span>
      <span class="text-[10px] font-bold">Orders</span>
    </button>
    <button onclick="switchNav('menu')" id="nav-menu" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
      <span class="text-lg">📖</span>
      <span class="text-[10px] font-bold">Menu Catalog</span>
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://glkutdkwbrjpiuqcmgwe.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsa3V0ZGt3YnJqcGl1cWNtZ3dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzU3MTMsImV4cCI6MjEwNTU1MTcxM30.f2SgZJvP681imm0Qe1fKsATnCk_86z2guwvZWASXoZM';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentVendorId = null;
    let isStoreOpen = true;
    let audioContext = null;

    // Play Alert Chime for New Orders
    function playOrderChime() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, audioContext.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.3); // A5
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.4);
      } catch (e) { console.log("Audio waiting for user click"); }
    }

    async function initDashboard() {
      try {
        const { data: vendors } = await supabase.from('vendors').select('*').limit(1);

        if (vendors && vendors.length > 0) {
          currentVendorId = vendors[0].id;
          document.getElementById('store-name').innerText = vendors[0].name || vendors[0].store_name || "Mama's Chow";
          document.getElementById('store-email').innerText = vendors[0].email || "vendor@delivery.com";
          isStoreOpen = vendors[0].is_open !== false;
          updateStoreStatusUI();
        }

        await fetchOrders();
        await fetchMenuItems();

        // Realtime listener for incoming WhatsApp orders
        supabase.channel('public:orders')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
            if (payload.new.vendor_id === currentVendorId) {
              playOrderChime();
              fetchOrders();
            }
          })
          .subscribe();

      } catch (err) {
        console.error('❌ Dashboard init error:', err.message);
      }
    }

    async function fetchOrders() {
      const ordersContainer = document.getElementById('orders-container');
      if (!currentVendorId) return;

      const { data: orders } = await supabase
        .from('orders')
        .select('*')
        .eq('vendor_id', currentVendorId)
        .order('created_at', { ascending: false });

      if (!orders || orders.length === 0) {
        document.getElementById('metric-new').innerText = '0';
        document.getElementById('metric-preparing').innerText = '0';
        document.getElementById('metric-ready').innerText = '0';
        document.getElementById('badge-new').innerText = '0';
        document.getElementById('badge-prep').innerText = '0';
        document.getElementById('wallet-balance').innerText = '₦0';
        ordersContainer.innerHTML = `<div class="bg-gray-900/50 border border-gray-800/80 rounded-2xl p-8 text-center text-gray-500 text-sm">No active orders</div>`;
        return;
      }

      let newCount = 0, prepCount = 0, readyCount = 0, totalEarned = 0;
      ordersContainer.innerHTML = '';

      orders.forEach(order => {
        if (order.status === 'pending') newCount++;
        if (order.status === 'preparing') prepCount++;
        if (order.status === 'ready') readyCount++;
        if (order.status === 'delivered') totalEarned += Number(order.total_amount || 0);

        ordersContainer.innerHTML += `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-amber-400">Order #${order.id.toString().slice(0, 6)}</span>
              <span class="text-[10px] bg-gray-800 text-emerald-400 px-2 py-0.5 rounded-full uppercase font-bold">${order.status}</span>
            </div>
            <p class="text-xs text-gray-300">📍 ${order.delivery_address || 'Address provided'}</p>
            <div class="flex justify-between items-center pt-2 border-t border-gray-800/80">
              <span class="text-xs font-bold text-emerald-400">₦${order.total_amount || 0}</span>
              ${order.status === 'pending' ? `
                <button onclick="updateOrderStatus('${order.id}', 'preparing')" class="bg-amber-500 text-black px-3 py-1 rounded-lg text-xs font-extrabold">Accept & Prepare</button>
              ` : order.status === 'preparing' ? `
                <button onclick="updateOrderStatus('${order.id}', 'ready')" class="bg-emerald-500 text-black px-3 py-1 rounded-lg text-xs font-extrabold">Mark Ready for Rider</button>
              ` : `<span class="text-[11px] text-gray-400 font-bold">Awaiting Rider Pick Up</span>`}
            </div>
          </div>
        `;
      });

      document.getElementById('metric-new').innerText = newCount;
      document.getElementById('metric-preparing').innerText = prepCount;
      document.getElementById('metric-ready').innerText = readyCount;
      document.getElementById('badge-new').innerText = newCount;
      document.getElementById('badge-prep').innerText = prepCount;
      document.getElementById('wallet-balance').innerText = `₦${totalEarned.toLocaleString()}`;
    }

    async function updateOrderStatus(orderId, newStatus) {
      await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
      fetchOrders();
    }

    async function toggleStoreStatus() {
      isStoreOpen = !isStoreOpen;
      updateStoreStatusUI();
      if (currentVendorId) {
        await supabase.from('vendors').update({ is_open: isStoreOpen }).eq('id', currentVendorId);
      }
    }

    function updateStoreStatusUI() {
      const btn = document.getElementById('store-status-btn');
      const txt = document.getElementById('status-text');
      const dot = document.getElementById('status-dot');
      if (isStoreOpen) {
        txt.innerText = 'Store Open';
        btn.className = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
      } else {
        txt.innerText = 'Store Closed';
        btn.className = 'bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2';
        dot.className = 'w-2 h-2 rounded-full bg-red-400';
      }
    }

    function requestInstantPayout() {
      alert("⚡ Cashout request submitted! Funds will be transferred to your registered bank account.");
    }

    async function fetchMenuItems() {
      if (!currentVendorId) return;
      const { data: items } = await supabase.from('menu_items').select('*').eq('restaurant_id', currentVendorId);
      const menuContainer = document.getElementById('menu-container');
      menuContainer.innerHTML = '';
      if (!items || items.length === 0) {
        menuContainer.innerHTML = `<p class="text-xs text-gray-500">No items added yet.</p>`;
        return;
      }
      items.forEach(item => {
        menuContainer.innerHTML += `
          <div class="flex justify-between items-center bg-gray-900 border border-gray-800 p-3 rounded-xl text-xs">
            <span class="font-bold text-gray-200">${item.title || item.name}</span>
            <span class="text-emerald-400 font-extrabold">₦${item.price}</span>
          </div>`;
      });
    }

    async function addMenuItem() {
      const name = document.getElementById('item-name').value.trim();
      const price = document.getElementById('item-price').value.trim();
      if (!name || !price || !currentVendorId) return alert('Enter name and price!');
      await supabase.from('menu_items').insert([{ restaurant_id: currentVendorId, title: name, price: Number(price) }]);
      document.getElementById('item-name').value = '';
      document.getElementById('item-price').value = '';
      fetchMenuItems();
    }

    function switchNav(nav) {
      if (nav === 'orders') {
        document.getElementById('view-orders').classList.remove('hidden');
        document.getElementById('view-menu').classList.add('hidden');
        document.getElementById('nav-orders').className = 'flex flex-col items-center gap-1 text-emerald-400';
        document.getElementById('nav-menu').className = 'flex flex-col items-center gap-1 text-gray-400 hover:text-white';
      } else {
        document.getElementById('view-orders').classList.add('hidden');
        document.getElementById('view-menu').classList.remove('hidden');
        document.getElementById('nav-orders').className = 'flex flex-col items-center gap-1 text-gray-400 hover:text-white';
        document.getElementById('nav-menu').className = 'flex flex-col items-center gap-1 text-emerald-400';
      }
    }

    function switchTab(tab) {
      const btnOrders = document.getElementById('tab-btn-orders');
      const btnPrep = document.getElementById('tab-btn-prep');
      if (tab === 'orders') {
        btnOrders.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-black shadow transition';
        btnPrep.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition';
      } else {
        btnOrders.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition';
        btnPrep.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-black shadow transition';
      }
    }

    initDashboard();
  </script>
</body>
</html>
